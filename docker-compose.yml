# Sahhanito: one-command deploy.   cp .env.example .env  (fill it)  &&  docker compose up -d --build
# Only Caddy is published (80/443). Create staff accounts afterwards:
#   docker compose exec backend python -m app.cli create-staff --email … --name … --role MANAGER --hospital charles-nicolle
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sahhanito
      POSTGRES_USER: sahhanito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahhanito -d sahhanito"]
      interval: 5s
      retries: 20

  ai:
    build: ./ai
    restart: unless-stopped
    environment:
      SAHHANITO_LLM_PROVIDER: ${SAHHANITO_LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SAHHANITO_GEMINI_MODEL: ${SAHHANITO_GEMINI_MODEL:-gemini-3.8-flash}
      SAHHANITO_CORS: https://${APP_DOMAIN}

  sim:
    build: { context: ., dockerfile: hospital-sim/Dockerfile }
    restart: unless-stopped
    environment:
      SIM_SPEED: ${SIM_SPEED:-1}

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      ai: { condition: service_started }
      sim: { condition: service_started }
    environment:
      DATABASE_URL: postgresql+psycopg://sahhanito:${POSTGRES_PASSWORD}@db:5432/sahhanito
      AI_URL: http://ai:8000
      SIM_URL: http://sim:8200
      PUBLIC_BASE_URL: https://${APP_DOMAIN}
      CORS_ORIGINS: https://${APP_DOMAIN},https://${STAFF_DOMAIN}
      REFERRAL_TIMEOUT_EMERGENCY_S: ${REFERRAL_TIMEOUT_EMERGENCY_S:-180}
      REFERRAL_TIMEOUT_HIGH_S: ${REFERRAL_TIMEOUT_HIGH_S:-600}
      AMBULANCE_TIME_SCALE: ${AMBULANCE_TIME_SCALE:-1}
      IOT_KEY: ${IOT_KEY:?set IOT_KEY (shared with iot-sim)}
      IMAGE_KEY: ${IMAGE_KEY:?set IMAGE_KEY (python3 -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())")}

  # Simulated ambulance monitors (IoT): signed vital-sign telemetry to the backend. Remove for a real fleet.
  iot-sim:
    build: ./iot-sim
    restart: unless-stopped
    depends_on: [backend]
    environment:
      BACKEND_URL: http://backend:8100
      IOT_KEY: ${IOT_KEY:?set IOT_KEY (shared with the backend)}

  web:
    build: { context: ., dockerfile: deploy/web.Dockerfile }
    restart: unless-stopped
    depends_on: [backend]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      STAFF_DOMAIN: ${STAFF_DOMAIN:?set STAFF_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes: [caddy-data:/data, caddy-config:/config]

volumes:
  db-data:
  caddy-data:
  caddy-config:
